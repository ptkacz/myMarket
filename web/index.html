<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>myMarket — portfolio</title>
  <meta name="theme-color" content="#F8FAFC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="myMarket" />
  <meta name="referrer" content="no-referrer" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/app.css?v=1.5.0" />
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased selection:bg-blue-100 selection:text-blue-900">

  <div class="safe-area max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-5 sm:py-8">

    <!-- Header -->
    <header class="flex items-start justify-between gap-3 mb-4 sm:mb-5">
      <div class="min-w-0">
        <div class="flex items-center gap-2.5">
          <img src="icons/icon.svg" alt="" class="w-7 h-7 rounded-lg shrink-0 shadow-sm" />
          <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-slate-900">myMarket</h1>
        </div>
        <p id="status-line" class="text-xs text-slate-500 mt-1 flex items-center gap-1.5 flex-wrap" data-i18n="loading">Loading…</p>
      </div>
      <div class="flex items-center gap-1.5 shrink-0 pt-1">
        <button id="btn-ai" type="button" title="Copy for AI" data-i18n-title="titleAi" class="icon-btn">
          <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9.8 3.5l1.2 3.3a2 2 0 001.2 1.2l3.3 1.2-3.3 1.2a2 2 0 00-1.2 1.2l-1.2 3.3-1.2-3.3a2 2 0 00-1.2-1.2L4.1 9.2l3.3-1.2a2 2 0 001.2-1.2l1.2-3.3zM17.5 13.5l.7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7.7-1.8z"/></svg>
          <span class="hidden sm:inline text-xs font-semibold">AI</span>
        </button>
        <button id="btn-refresh" type="button" title="Refresh quotes" data-i18n-title="titleRefresh" class="icon-btn">
          <svg id="refresh-icon" class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.6m14.8 2A8 8 0 004.6 9m0 0H9m11 11v-5h-.6m0 0a8 8 0 01-15.4-2m15.4 2H15"/></svg>
        </button>
        <button id="btn-settings" type="button" title="Settings" data-i18n-title="titleSettings" class="icon-btn">
          <svg class="w-[18px] h-[18px]" fill="none" stroke="currentColor" stroke-width="1.9" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.3 4.3c.4-1.8 3-1.8 3.4 0a1.7 1.7 0 002.6 1.1c1.5-.9 3.3.8 2.4 2.4a1.7 1.7 0 001 2.5c1.8.5 1.8 3 0 3.5a1.7 1.7 0 00-1 2.5c.9 1.6-.9 3.3-2.4 2.4a1.7 1.7 0 00-2.6 1.1c-.4 1.8-3 1.8-3.4 0a1.7 1.7 0 00-2.6-1.1c-1.5.9-3.3-.8-2.4-2.4a1.7 1.7 0 00-1-2.5c-1.8-.5-1.8-3 0-3.5a1.7 1.7 0 001-2.5c-.9-1.6.9-3.3 2.4-2.4 1 .6 2.3.1 2.6-1.1z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
        </button>
      </div>
    </header>

    <!-- Notices (demo / error) -->
    <div id="notice" class="hidden mb-4"></div>

    <!-- Main view switcher (Portfolio / Watchlist) -->
    <nav role="tablist" aria-label="Main view" class="inline-flex bg-slate-200/70 p-1 rounded-xl mb-4">
      <button id="nav-portfolio" role="tab" type="button" class="seg-btn" aria-selected="true" data-i18n="navPortfolio">Portfolio</button>
      <button id="nav-watchlist" role="tab" type="button" class="seg-btn inline-flex items-center gap-1.5" aria-selected="false">
        <span data-i18n="navWatchlist">Watchlist</span>
        <span id="watch-hit-badge" class="hidden inline-flex items-center gap-1 px-1.5 py-0 rounded-full text-[10.5px] font-bold bg-emerald-600 text-white leading-[16px] tabular-nums"></span>
      </button>
    </nav>

    <!-- Main card -->
    <main class="bg-white rounded-3xl border border-slate-200/90 shadow-sm overflow-hidden">

      <!-- Portfolio view -->
      <div id="view-portfolio">
      <!-- Toolbar -->
      <div class="px-4 sm:px-7 py-3.5 border-b border-slate-100 bg-slate-50/60 flex flex-col gap-3">
        <div class="flex flex-wrap items-center justify-between gap-2.5">
          <div class="flex flex-wrap items-center gap-2">
            <div role="tablist" aria-label="Grouping mode" class="inline-flex bg-slate-200/70 p-1 rounded-xl">
              <button id="tab-stocks" role="tab" type="button" class="seg-btn" data-i18n="tabStocks">By stock</button>
              <button id="tab-categories" role="tab" type="button" class="seg-btn" data-i18n="tabCategories">By category</button>
            </div>
            <div role="tablist" aria-label="Position scope" class="inline-flex bg-slate-200/70 p-1 rounded-xl">
              <button id="scope-open" role="tab" type="button" class="seg-btn" data-i18n="scopeOpen">Open</button>
              <button id="scope-all" role="tab" type="button" class="seg-btn" data-i18n="scopeAll">All</button>
              <button id="scope-closed" role="tab" type="button" class="seg-btn" data-i18n="scopeClosed">Closed</button>
            </div>
          </div>
          <div class="flex items-center gap-2 flex-wrap">
            <button id="chip-cash" type="button" class="chip" aria-pressed="false"><span class="chip-dot"></span><span data-i18n="chipCash">Cash</span></button>
            <button id="chip-crypto" type="button" class="chip hidden" aria-pressed="true"><span class="chip-dot"></span><span data-i18n="chipCrypto">Crypto</span></button>
            <button id="chip-prepost" type="button" class="chip hidden" aria-pressed="false"><span class="chip-dot"></span><span data-i18n="chipPrePost">Pre/Post</span></button>
          </div>
        </div>
      </div>

      <!-- Chart + list -->
      <div class="p-4 sm:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">

        <div class="lg:col-span-6 flex flex-col items-center lg:sticky lg:top-6">
          <div id="chart-wrap" class="relative w-full max-w-[400px] aspect-square flex items-center justify-center">
            <svg id="portfolio-svg" viewBox="0 0 420 420" class="w-full h-full overflow-visible" role="img" aria-label="Portfolio structure chart">
              <defs>
                <filter id="slice-shadow" x="-15%" y="-15%" width="130%" height="130%">
                  <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.16" />
                </filter>
              </defs>
              <g id="svg-slices"></g>
              <g id="svg-labels"></g>
            </svg>
            <div id="donut-center" class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none px-[18%] text-center transition-opacity duration-200">
              <span id="center-eyebrow" class="text-[11px] font-semibold uppercase tracking-wider text-slate-400"></span>
              <span id="center-primary" class="text-xl sm:text-2xl font-extrabold text-slate-900 tracking-tight mt-0.5 tabular-nums leading-tight"></span>
              <span id="center-secondary" class="text-xs font-semibold mt-1 tabular-nums"></span>
              <span id="center-tertiary" class="text-[11px] font-medium mt-0.5 tabular-nums leading-snug"></span>
            </div>
          </div>

          <div id="closed-summary" class="hidden w-full rounded-2xl border border-slate-200/90 bg-slate-50/70 p-5 text-center"></div>

          <div id="detail-banner" class="hidden w-full mt-4 scroll-mt-3 rounded-2xl ring-2 ring-slate-900 bg-white p-3.5 sm:p-4 shadow-sm transition-all">
            <div id="detail-content"></div>
          </div>
        </div>

        <div class="lg:col-span-6 flex flex-col">
          <div class="flex items-center justify-between mb-3 px-1 gap-2">
            <h2 id="legend-heading" class="text-sm font-bold uppercase tracking-wider text-slate-500"></h2>
            <select id="sort-select" aria-label="Sort" class="bg-transparent text-xs font-semibold text-slate-600 focus:outline-none cursor-pointer">
              <option value="value" data-i18n="sortValue">Value</option>
              <option value="pnlPct" data-i18n="sortPnlPct">P/L %</option>
              <option value="dailyPct" data-i18n="sortDaily">Daily change</option>
              <option value="name" data-i18n="sortName">A–Z</option>
            </select>
          </div>

          <div id="legend-list" class="rounded-2xl border border-slate-200/80 bg-white divide-y divide-slate-100 overflow-hidden"></div>

          <div id="closed-section" class="hidden mt-5">
            <div class="flex items-center justify-between mb-2 px-1">
              <h3 id="closed-heading" class="text-xs font-bold uppercase tracking-wider text-slate-400"></h3>
            </div>
            <div id="closed-list" class="rounded-2xl border border-slate-200/80 bg-white divide-y divide-slate-100 overflow-hidden"></div>
          </div>

          <div id="warnings" class="hidden mt-4"></div>
        </div>
      </div>
      </div>

      <!-- Watchlist view -->
      <div id="view-watchlist" class="hidden">
        <div class="px-4 sm:px-7 py-3.5 border-b border-slate-100 bg-slate-50/60 flex flex-wrap items-center justify-between gap-2.5">
          <div class="flex items-center gap-2.5">
            <span id="watch-heading" class="text-xs font-semibold text-slate-500 tabular-nums"></span>
            <span id="watch-hits-pill" class="hidden inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200/80 tabular-nums"></span>
          </div>
          <div class="flex items-center gap-2.5 flex-wrap">
            <button id="watch-chip-prepost" type="button" class="chip hidden" aria-pressed="false"><span class="chip-dot"></span><span data-i18n="chipPrePost">Pre/Post</span></button>
            <select id="watch-sort" aria-label="Sort" class="bg-transparent text-xs font-semibold text-slate-600 focus:outline-none cursor-pointer">
              <option value="status" data-i18n="watchSortStatus">Status</option>
              <option value="distance" data-i18n="watchSortDist">Distance</option>
              <option value="dailyPct" data-i18n="sortDaily">Daily change</option>
              <option value="name" data-i18n="sortName">A–Z</option>
            </select>
          </div>
        </div>

        <div class="p-4 sm:p-8 grid grid-cols-1 lg:grid-cols-12 gap-6 lg:gap-8 items-start">
          <div id="watch-detail-col" class="hidden lg:col-span-5 lg:sticky lg:top-6">
            <div id="watch-detail" class="w-full scroll-mt-3 rounded-2xl ring-2 ring-slate-900 bg-white p-3.5 sm:p-4 shadow-sm transition-all">
              <div id="watch-detail-content"></div>
            </div>
          </div>
          <div id="watch-list-col" class="lg:col-span-12 flex flex-col">
            <div id="watch-list" class="rounded-2xl border border-slate-200/80 bg-white divide-y divide-slate-100 overflow-hidden"></div>
          </div>
        </div>
      </div>
    </main>

    <p class="text-center text-[11px] text-slate-400 mt-6">myMarket v<span id="app-version"></span> · <span data-i18n="footerApp">data from your Google Sheet · quotes: Yahoo Finance / Google Finance</span></p>
  </div>

  <!-- Tooltip (pointer devices only) -->
  <div id="floating-tooltip" class="fixed z-50 pointer-events-none opacity-0 transition-opacity duration-150 bg-slate-900/95 backdrop-blur-md text-white rounded-2xl shadow-xl border border-slate-700/80 p-4 w-72 text-sm" style="left:0;top:0"></div>

  <!-- Settings -->
  <dialog id="dlg-settings" class="dlg">
    <form method="dialog" class="p-5 sm:p-6 space-y-4">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold" data-i18n="settingsTitle">Settings</h3>
        <button value="cancel" class="icon-btn" aria-label="Close" data-i18n-title="titleClose">✕</button>
      </div>
      <div class="space-y-3">
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-400" data-i18n="secConnection">Sheet connection</div>
        <label class="block">
          <span class="text-xs font-medium text-slate-600" data-i18n="lblApi">API URL (or paste full link from Sheet)</span>
          <input id="in-api" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" class="field" />
        </label>
        <label class="block">
          <span class="text-xs font-medium text-slate-600" data-i18n="lblToken">Token</span>
          <input id="in-token" type="password" autocomplete="off" class="field" />
        </label>
        <p class="text-[11px] text-slate-400" data-i18n-html="settingsHint"></p>
      </div>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-2">
          <div class="text-xs font-semibold uppercase tracking-wider text-slate-400" data-i18n="secAppearance">Appearance</div>
          <div class="inline-flex bg-slate-100 p-1 rounded-xl">
            <button id="btn-style-donut" type="button" class="seg-btn" data-i18n="styleDonut">Donut</button>
            <button id="btn-style-pie" type="button" class="seg-btn" data-i18n="stylePie">Full pie</button>
          </div>
        </div>
        <div class="space-y-2">
          <div class="text-xs font-semibold uppercase tracking-wider text-slate-400" data-i18n="secLanguage">Language</div>
          <div class="inline-flex bg-slate-100 p-1 rounded-xl">
            <button id="btn-lang-en" type="button" class="seg-btn">English</button>
            <button id="btn-lang-pl" type="button" class="seg-btn">Polski</button>
          </div>
        </div>
      </div>
      <div class="flex flex-wrap gap-2 pt-2 border-t border-slate-100">
        <button id="btn-save-config" type="button" class="btn-primary" data-i18n="btnSaveConnect">Save &amp; connect</button>
        <button id="btn-reload-app" type="button" class="btn-secondary" data-i18n="btnReloadApp">Reload app</button>
        <button id="btn-demo" type="button" class="btn-secondary" data-i18n="btnDemo">Demo mode</button>
        <button id="btn-disconnect" type="button" class="btn-secondary text-rose-600" data-i18n="btnDisconnect">Disconnect</button>
      </div>
    </form>
  </dialog>

  <!-- Export for AI -->
  <dialog id="dlg-ai" class="dlg">
    <div class="p-5 sm:p-6 space-y-3">
      <div class="flex items-center justify-between">
        <h3 class="text-lg font-bold" data-i18n="aiTitle">Portfolio for AI</h3>
        <button id="btn-ai-close" type="button" class="icon-btn" aria-label="Close" data-i18n-title="titleClose">✕</button>
      </div>
      <p class="text-xs text-slate-500" data-i18n="aiDesc">Copy and paste into Gemini / ChatGPT / Claude to discuss your next moves.</p>
      <div class="flex flex-wrap items-center gap-2">
        <div class="inline-flex bg-slate-100 p-1 rounded-xl">
          <button id="ai-fmt-md" type="button" class="seg-btn" data-i18n="aiFmtText">Text</button>
          <button id="ai-fmt-json" type="button" class="seg-btn" data-i18n="aiFmtJson">JSON</button>
        </div>
        <button id="ai-hide" type="button" class="chip" aria-pressed="false"><span class="chip-dot"></span><span data-i18n="aiHideAmounts">Hide amounts</span></button>
        <button id="ai-prompt" type="button" class="chip" aria-pressed="true"><span class="chip-dot"></span><span data-i18n="aiIncludePrompt">Add prompt</span></button>
      </div>
      <textarea id="ai-text" readonly class="w-full h-64 text-[11px] leading-snug font-mono bg-slate-50 border border-slate-200 rounded-xl p-3 focus:outline-none"></textarea>
      <div class="flex flex-wrap gap-2">
        <button id="btn-ai-copy" type="button" class="btn-primary" data-i18n="btnCopy">Copy</button>
        <button id="btn-ai-share" type="button" class="btn-secondary hidden" data-i18n="btnShare">Share…</button>
      </div>
    </div>
  </dialog>

  <script src="js/i18n.js?v=1.5.0"></script>
  <script src="js/format.js?v=1.5.0"></script>
  <script src="js/demo.js?v=1.5.0"></script>
  <script src="js/api.js?v=1.5.0"></script>
  <script src="js/engine.js?v=1.5.0"></script>
  <script src="js/chart.js?v=1.5.0"></script>
  <script src="js/ai-export.js?v=1.5.0"></script>
  <script src="js/app.js?v=1.5.0"></script>
</body>
</html>
